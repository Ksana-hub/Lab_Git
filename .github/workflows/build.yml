name: CMake Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup C++ compiler
      uses: actions/setup-cpp@v1

    - name: Configure CMake
      run: cmake -S . -B build

    - name: Build
      run: cmake --build build
